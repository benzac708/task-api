name: build-and-publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Bump image tag in config repo
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/benzac708/task-api-config.git /tmp/config
          cd /tmp/config/base
          sed -i 's|image: ghcr.io/benzac708/task-api:.*|image: ghcr.io/benzac708/task-api:${{ github.sha }}|' deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "chore: bump task-api to ${{ github.sha }}"
          git push origin main